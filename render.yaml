services:
  - type: web
    name: agent-010
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Render injects $PORT automatically
    startCommand: uvicorn backend:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      # Secrets below are set in the Render dashboard (Environment tab),
      # never committed to git:
      # AI_API_KEY / GROQ_API_KEY  -> your Groq gsk_... key
      # GEMINI_API_KEY             -> your Google AIza... key (backup brain)
      # APP_PASSWORD               -> your 010 login password
