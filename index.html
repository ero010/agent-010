<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personal Guide</title>
<style>
*{box-sizing:border-box}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;margin:0;min-height:100vh;display:flex;flex-direction:column;color:#101c30;background:linear-gradient(150deg,#ffffff 0%,#e9f1ff 32%,#f4eaff 62%,#e3f9ff 100%);background-attachment:fixed}
header{padding:12px 18px;background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(120,110,255,.25);box-shadow:0 4px 24px rgba(90,80,220,.12);display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:10}
header b{font-size:19px;letter-spacing:.5px;background:linear-gradient(90deg,#1a3fd4,#7b2ff7,#c89b3c);-webkit-background-clip:text;background-clip:text;color:transparent}
#chat{flex:1;overflow:auto;padding:20px 16px 8px;display:flex;flex-direction:column;gap:12px;max-width:900px;width:100%;margin:0 auto}
.msg{max-width:85%;padding:12px 16px;border-radius:18px;white-space:pre-wrap;position:relative;line-height:1.5;box-shadow:0 6px 20px rgba(60,60,180,.10);animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.me{align-self:flex-end;background:linear-gradient(135deg,#2f6bff,#00c2d8);color:#fff;border-bottom-right-radius:6px}
.bot{align-self:flex-start;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border:1px solid rgba(130,120,255,.25);border-bottom-left-radius:6px}
.tools{margin-top:8px;display:flex;gap:8px;font-size:12px}
.tools span{cursor:pointer;padding:4px 12px;border-radius:999px;background:rgba(123,47,247,.08);border:1px solid rgba(123,47,247,.25);transition:background .12s}
.tools span:hover{background:rgba(123,47,247,.18);opacity:1}
.attach{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;border:1px solid rgba(120,110,255,.3);background:rgba(255,255,255,.85);cursor:pointer;box-shadow:0 3px 10px rgba(90,80,220,.10);font-size:14px;white-space:nowrap;color:#1a2b4a}
.attach:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(90,80,220,.20)}
#host{font-size:11px;padding:3px 10px;border-radius:999px;background:rgba(0,194,216,.12);border:1px solid rgba(0,194,216,.35);color:#0a6b7a}
button:disabled{opacity:.5;cursor:wait;transform:none}
.when{font-size:10px;opacity:.5;margin-top:4px}
.typing i{display:inline-block;animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
#bar{display:flex;gap:8px;padding:12px 16px;max-width:900px;width:100%;margin:0 auto}
#in{flex:1;padding:13px 18px;border-radius:999px;border:1px solid rgba(120,110,255,.35);background:rgba(255,255,255,.9);color:#101c30;box-shadow:0 4px 16px rgba(90,80,220,.12);outline:none}
#in:focus{border-color:#7b2ff7;box-shadow:0 0 0 3px rgba(123,47,247,.15)}
button{padding:10px 16px;border-radius:999px;border:1px solid rgba(120,110,255,.3);background:rgba(255,255,255,.85);color:#1a2b4a;cursor:pointer;box-shadow:0 3px 10px rgba(90,80,220,.10);transition:transform .12s,box-shadow .12s}
button:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(90,80,220,.20)}
#bar>button{background:linear-gradient(135deg,#2f6bff,#7b2ff7);color:#fff;border:none}
small{color:#5b6b86}
#login{position:fixed;inset:0;background:linear-gradient(150deg,#dfe9ff,#f0e6ff);display:flex;align-items:center;justify-content:center;z-index:99}
#login div{background:rgba(255,255,255,.85);backdrop-filter:blur(16px);padding:32px;border-radius:22px;display:flex;flex-direction:column;gap:12px;min-width:300px;box-shadow:0 20px 60px rgba(90,80,220,.25);border:1px solid rgba(255,255,255,.9);text-align:center}
#login b{font-size:24px;background:linear-gradient(90deg,#1a3fd4,#7b2ff7,#c89b3c);-webkit-background-clip:text;background-clip:text;color:transparent}
#login input{padding:12px 16px;border-radius:12px;border:1px solid rgba(120,110,255,.35);color:#101c30}
#login button{background:linear-gradient(135deg,#2f6bff,#7b2ff7);color:#fff;border:none;font-size:15px}
#settings>div{background:#fff !important;color:#101c30 !important;box-shadow:0 20px 60px rgba(90,80,220,.25)}
#settings input,#settings select{background:#f2f5ff !important;color:#101c30 !important;border:1px solid rgba(120,110,255,.3) !important}
#settings small{color:#5b6b86 !important}
#nudges,#pc,#stage{max-width:900px;width:100%;margin:0 auto}
input[type=file]{display:none}
</style></head><body>
<div id="login" style="display:none"><div>
<b>✦ Personal Guide</b><small>Enter password</small>
<input id="pw" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
<button onclick="doLogin()">Unlock</button>
<small id="loginerr" style="color:#f66"></small>
</div></div>
<header><b>✦ Personal Guide</b><small id="status">life manager</small><small id="model"></small><span id="host"></span>
<span style="flex:1"></span>
<button onclick="saveProfile()">Save profile</button>
<button onclick="toggleVoice()">◉ Voice</button>
<button onclick="snap()">◎ Camera</button>
<button onclick="openSettings()" title="Change brain: model + API key">Brain</button>
<button onclick="clearChat()" title="Delete all chat">✕ Clear</button>
<button onclick="logout()" title="Lock">Lock</button>
<label class="attach" for="f" title="Text files and images only">＋ Attach</label>
<input type="file" id="f" accept=".txt,.md,.csv,.json,.png,.jpg,.jpeg,.webp" onchange="stageFile()"></header>
<div id="settings" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:98;align-items:center;justify-content:center">
<div style="background:#171a21;padding:20px;border-radius:12px;display:flex;flex-direction:column;gap:10px;width:min(420px,92vw);max-height:88vh;overflow:auto">
<b>Brain settings</b>
<small>Using now: <b id="curmodel"></b> (<span id="curkey"></span>)</small>
<label><small>Choose brain</small><br><select id="setmodel" onchange="showFeatures()" style="width:100%"></select></label>
<label id="customwrap" style="display:none"><small>Custom model id (exact id from the provider)</small><br><input id="setcustom" style="width:100%" placeholder="e.g. deepseek/deepseek-chat:free"></label>
<div id="feat" style="font-size:13px"></div>
<label><small>Server address (auto-filled)</small><br><input id="seturl" style="width:100%"></label>
<label><small>API key (leave blank to keep saved one)</small><br><input id="setkey" type="password" placeholder="paste new key here" style="width:100%"></label>
<small id="keysrc"></small>
<div style="display:flex;gap:8px;flex-wrap:wrap"><button onclick="saveSettings()">Save</button><button onclick="testSettings()">Test</button><button onclick="closeSettings()">Close</button></div>
<small id="setmsg"></small>
<hr style="border-color:#333;width:100%">
<small><b>Move Personal Guide to another device / cloud:</b></small>
<div style="display:flex;gap:8px;flex-wrap:wrap"><button onclick="exportMem()">Export memory</button><button onclick="document.getElementById('impfile').click()">Import memory</button>
<input type="file" id="impfile" accept=".json" style="display:none" onchange="importMem()"></div>
</div></div>
<div id="chat"></div>
<div id="nudges" style="display:none;flex-direction:column;gap:8px;padding:8px 12px;background:#171a21;border-top:1px solid #222"></div>
<div id="pc" style="display:none;flex-direction:column;gap:8px;padding:8px 12px;background:#171a21;border-top:1px solid #444"></div>
<div id="stage" style="display:none;gap:8px;padding:8px 12px;background:#171a21;border-top:1px solid #222;align-items:center"><span id="stagename"></span><button onclick="clearStaged()">✕</button></div>
<div id="bar"><input id="in" placeholder="Ask your Personal Guide..." onkeydown="if(event.key==='Enter')send()">
<button id="sendbtn" onclick="send()">Send</button>
<button onclick="speakLast()">Speak</button></div>
<video id="cam" style="display:none" autoplay playsinline width="320"></video>
<canvas id="cv" style="display:none"></canvas>
<script>
let lastReply="", listening=false, recog=null, img=null;
const pw = () => localStorage.getItem('lm_pw') || '';
function headers(j=true){ const h={}; if(j) h['Content-Type']='application/json'; if(pw()) h['x-app-password']=pw(); return h; }
async function api(path, opts={}){
  opts.headers = Object.assign(headers(!opts.body || typeof opts.body==='string'), opts.headers||{});
  const r = await fetch(path, opts);
  if(r.status===401){ document.getElementById('login').style.display='flex'; throw new Error('locked'); }
  return r;
}
function doLogin(){ const v=document.getElementById('pw').value; localStorage.setItem('lm_pw', v); document.getElementById('login').style.display='none'; loadHistory(); }
function logout(){ localStorage.removeItem('lm_pw'); location.reload(); }
function fmtTime(at){ if(!at)return ''; try{ const d=new Date(at); return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
function bubble(id, who, text, at){
  const d=document.createElement('div'); d.className='msg '+who; d.id='m-'+id;
  const t=document.createElement('div'); t.textContent=text; d.appendChild(t);
  const w=fmtTime(at); if(w){ const s=document.createElement('div'); s.className='when'; s.textContent=w; d.appendChild(s); }
  const tools=document.createElement('div'); tools.className='tools';
  tools.innerHTML='<span title="Edit">Edit</span><span title="Delete">Delete</span>';
  tools.children[0].onclick=()=>editMsg(id, text);
  tools.children[1].onclick=()=>delMsg(id);
  d.appendChild(tools);
  document.getElementById('chat').appendChild(d);
  d.scrollIntoView({block:'nearest'});
  return d;
}
let allMsgs=[];
async function loadHistory(){
  try{
    const r=await api('/api/history'); const j=await r.json();
    allMsgs=j.conversations||[];
    document.getElementById('chat').innerHTML='';
    if(!allMsgs.length){
      bubble('welcome','bot',"Yo, I'm Personal Guide. I remember everything you tell me. Give me your name + your #1 goal + what's blocking you.");
      return;
    }
    renderMsgs(50);
    if(j.profile && j.profile.name) document.getElementById('status').textContent='chat + memory ('+j.profile.name+')';
  }catch(e){ if(e.message!=='locked') bubble('err','bot','Note: Cannot load: '+e.message); }
}
function addBot(text, at){
  // Personal Guide double-texts: /// splits one reply into consecutive bubbles
  String(text||'').split('///').map(s=>s.trim()).filter(Boolean)
    .forEach((p,i)=>bubble('b'+Date.now()+i,'bot',p,at));
}
function renderMsgs(n){
  const box=document.getElementById('chat');
  const nearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<160;
  box.innerHTML='';
  const shown=allMsgs.slice(-n);
  if(allMsgs.length>n){
    const b=document.createElement('button'); b.textContent='Show older ('+(allMsgs.length-n)+' more)';
    b.onclick=()=>renderMsgs(n+100); box.appendChild(b);
  }
  shown.forEach(c=>{
    if(c.role==='user'){ bubble(c.id||Math.random(),'me',c.content,c.at); }
    else { String(c.content||'').split('///').map(s=>s.trim()).filter(Boolean)
      .forEach(p=>bubble(c.id||Math.random(),'bot',p,c.at)); }
  });
  if(nearBottom||n<=50) box.scrollTop=box.scrollHeight;
}
let staged=null; // {kind:'image',dataUrl,file?} or {kind:'file',file}
function stageChip(t){ document.getElementById('stagename').textContent=t; document.getElementById('stage').style.display='flex'; }
function clearStaged(){ staged=null; img=null; document.getElementById('f').value=''; document.getElementById('stage').style.display='none'; }
async function stageFile(){
  const f=document.getElementById('f').files[0]; if(!f)return;
  const ok=/\.(txt|md|csv|json|png|jpg|jpeg|webp)$/i.test(f.name);
  if(!ok){ bubble('f'+Date.now(),'bot','Note: That file type is not supported yet. I can read text files (.txt, .md, .csv, .json) and see images (.png, .jpg, .webp).'); document.getElementById('f').value=''; return; }
  if(/\.(png|jpg|jpeg|webp)$/i.test(f.name)){
    const rd=new FileReader();
    rd.onload=()=>{ staged={kind:'image',dataUrl:rd.result,file:f}; img=rd.result; stageChip(f.name+' — write a message and Send'); };
    rd.readAsDataURL(f);
  } else { staged={kind:'file',file:f}; stageChip(f.name+' — write a message and Send'); }
}
let sending=false;
async function send(){
  if(sending)return;
  const t=document.getElementById('in').value.trim();
  if(!t&&!staged&&!img)return;
  sending=true; document.getElementById('sendbtn').disabled=true;
  document.getElementById('in').value='';
  const draft=t;
  const mine=t||(staged?'Attached: '+staged.file.name:'[image]');
  const optNode=bubble('tmp'+Date.now(),'me',mine,new Date().toISOString());
  const tp=document.createElement('div'); tp.className='msg bot typing'; tp.id='typing'; tp.innerHTML='<i>●</i> <i>●</i> <i>●</i>';
  document.getElementById('chat').appendChild(tp); tp.scrollIntoView({block:'nearest'});
  const done=()=>{ sending=false; document.getElementById('sendbtn').disabled=false; };
  try{
    let msg=t, b64=img;
    if(staged&&staged.kind==='image'){
      b64=staged.dataUrl;
      if(staged.file){
        const fd=new FormData(); fd.append('file',staged.file);
        await api('/api/upload',{method:'POST',body:fd,headers:pw()?{'x-app-password':pw()}:{}}).catch(()=>{});
      }
    }
    if(staged&&staged.kind==='file'){
      const fd=new FormData(); fd.append('file',staged.file);
      const r=await api('/api/upload',{method:'POST',body:fd,headers:pw()?{'x-app-password':pw()}:{}});
      const j=await r.json();
      if(j.error){ bubble('e'+Date.now(),'bot','Note: '+j.error); return; }
      msg=(t?t+'\n\n':'')+'[Attached file '+staged.file.name+']\n'+(j.extract||'saved');
    }
    const r2=await api('/api/chat',{method:'POST',body:JSON.stringify({message:msg,image_b64:b64})});
    const j2=await r2.json(); clearStaged();
    document.getElementById('typing').remove();
    if(j2.error){ optNode.remove(); document.getElementById('in').value=draft; bubble('e'+Date.now(),'bot','Note: '+j2.error+' — your message is back in the box, hit Send to retry.'); done(); return; }
    lastReply=(j2.reply||'').replaceAll('///',' ');
    addBot(j2.reply);
    await loadHistory();
    loadNudges();
    if(j2.learned){ bubble('l'+Date.now(),'bot','✓ '+j2.learned); }
    done();
  }catch(e){ document.getElementById('typing')?.remove(); optNode.remove(); document.getElementById('in').value=draft; if(e.message!=='locked') bubble('e'+Date.now(),'bot','Note: Send failed (connection?). Your message is back in the box — hit Send to retry.'); done(); }
}
async function editMsg(id, old){
  const v=prompt('Edit message:', old); if(v===null||v===old)return;
  await api('/api/message/'+id,{method:'PUT',body:JSON.stringify({content:v})});
  loadHistory();
}
let CAT=[];
async function refreshModelLabel(){ try{ const r=await api('/api/settings'); const j=await r.json(); document.getElementById('model').textContent=j.model; }catch(e){} }
async function openSettings(){
  const r=await api('/api/settings'); const j=await r.json(); CAT=j.catalog;
  document.getElementById('curmodel').textContent=j.model;
  document.getElementById('curkey').textContent='key '+j.key_preview;
  const s=document.getElementById('setmodel'); s.innerHTML='';
  CAT.forEach(e=>{ const o=document.createElement('option'); o.value=e.id; o.textContent=e.label+((e.env_key&&!e.has_key)?' (needs key)':''); if(e.id===j.model)o.selected=true; s.appendChild(o); });
  const oc=document.createElement('option'); oc.value='__custom'; oc.textContent=' Custom model id...'; s.appendChild(oc);
  if(!CAT.some(e=>e.id===j.model)){ s.value='__custom'; document.getElementById('setcustom').value=j.model; }
  document.getElementById('seturl').value=j.base_url;
  document.getElementById('setkey').value='';
  document.getElementById('setmsg').textContent='';
  showFeatures();
  document.getElementById('settings').style.display='flex';
}
function showFeatures(){
  const v=document.getElementById('setmodel').value;
  document.getElementById('customwrap').style.display=(v==='__custom')?'block':'none';
  if(v==='__custom'){ document.getElementById('feat').innerHTML='Type the exact model id. Keep the right server address below, paste the key, then Test.'; document.getElementById('keysrc').textContent=''; return; }
  const e=CAT.find(x=>x.id===v); if(!e)return;
  document.getElementById('seturl').value=e.base_url;
  document.getElementById('feat').innerHTML='✓ '+e.features.join('<br>✓ ')+(e.limits?'<br><b>Limits:</b> '+e.limits:'');
  document.getElementById('keysrc').textContent=e.key_from?('Get key: '+e.key_from):'No key needed.';
}
async function saveSettings(){
  let m=document.getElementById('setmodel').value;
  if(m==='__custom'){ m=document.getElementById('setcustom').value.trim(); if(!m){ document.getElementById('setmsg').textContent='Note: Type a custom model id first.'; return; } }
  const body={model:m, base_url:document.getElementById('seturl').value};
  const k=document.getElementById('setkey').value.trim(); if(k)body.api_key=k;
  const r=await api('/api/settings',{method:'POST',body:JSON.stringify(body)}); const j=await r.json();
  document.getElementById('setmsg').textContent=j.error?('Note: '+j.error):('✓ Now using '+j.model+' ('+j.key_preview+')');
  if(!j.error){ document.getElementById('curmodel').textContent=j.model; document.getElementById('curkey').textContent='key '+j.key_preview; refreshModelLabel(); }
}
async function testSettings(){
  document.getElementById('setmsg').textContent='Testing...';
  const r=await api('/api/ping'); const j=await r.json();
  document.getElementById('setmsg').textContent=j.ok?('✓ '+j.model+' replied: '+j.reply):('Note: '+(j.error||'failed'));
}
function closeSettings(){ document.getElementById('settings').style.display='none'; }
async function loadNudges(){
  try{
    const r=await api('/api/nudges'); const j=await r.json();
    const box=document.getElementById('nudges'); box.innerHTML='';
    const items=[];
    (j.due||[]).forEach(x=>items.push({kind:'due', ...x}));
    (j.insights||[]).forEach(x=>items.push({kind:'insight', ...x}));
    if(!items.length){ box.style.display='none'; return; }
    box.style.display='flex';
    items.forEach(x=>{
      const d=document.createElement('div');
      d.style.cssText='background:#1e222c;padding:8px 10px;border-radius:10px;font-size:14px';
      if(x.kind==='due'){
        d.innerHTML='◷ <b>'+escapeHtml(x.text)+'</b> <small>— you locked in?</small><br>';
        d.appendChild(nbtn('Done',()=>nudgeDone(x.id)));
        d.appendChild(nbtn('Snooze',()=>nudgeSnooze(x.id,30)));
        d.appendChild(nbtn('Remove',()=>nudgeDel(x.id)));
      } else {
        d.innerHTML='✦ '+escapeHtml(x.text)+'<br>';
        d.appendChild(nbtn('Got it',()=>nudgeDone(x.id)));
      }
      box.appendChild(d);
    });
  }catch(e){}
}
function nbtn(t,fn){ const b=document.createElement('button'); b.textContent=t; b.style.cssText='margin:4px 4px 0 0;padding:6px 10px'; b.onclick=fn; return b; }
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function nudgeDone(id){ await api('/api/nudge/done',{method:'POST',body:JSON.stringify({id})}); loadNudges(); }
async function nudgeSnooze(id,m){ await api('/api/nudge/snooze',{method:'POST',body:JSON.stringify({id,minutes:m})}); loadNudges(); }
async function nudgeDel(id){ await api('/api/nudge/'+id,{method:'DELETE'}); loadNudges(); }
async function loadPc(){
  try{
    const r=await api('/api/pc/pending'); const j=await r.json();
    const box=document.getElementById('pc'); box.innerHTML='';
    if(!j.local || !(j.pending||[]).length){ box.style.display='none'; return; }
    box.style.display='flex';
    j.pending.forEach(p=>{
      const d=document.createElement('div');
      d.style.cssText='background:#2a2118;border:1px solid #a80;padding:8px 10px;border-radius:10px;font-size:14px';
      const what=p.action==='open'?'Open <b>'+escapeHtml(p.target)+'</b>'
        :p.action==='run'?'Run <b>'+escapeHtml((p.command||'').slice(0,200))+'</b>'
        :'Write <b>'+escapeHtml(p.path||'')+'</b>';
      d.innerHTML=what+'<br><small>Personal Guide wants to do this on your laptop:</small><br>';
      d.appendChild(nbtn('Approve',()=>pcDecide(p.id,true,what)));
      d.appendChild(nbtn('Deny',()=>pcDecide(p.id,false,what)));
      box.appendChild(d);
    });
  }catch(e){}
}
async function pcDecide(id, ok, what){
  const r=await api('/api/pc/decide',{method:'POST',body:JSON.stringify({id,approve:ok})});
  const j=await r.json(); loadPc();
  if(!ok){ bubble('d'+Date.now(),'bot','Okay, skipped it.'); return; }
  if(j.error){ bubble('e'+Date.now(),'bot','Note: '+j.error); return; }
  bubble('r'+Date.now(),'bot','✓ '+j.summary+'\n'+String(j.result||'').slice(0,500));
  try{
    const r2=await api('/api/chat',{method:'POST',body:JSON.stringify({message:'System note, do not act on tools: my PC action "'+j.summary+'" finished with result: '+String(j.result||'').slice(0,800)+'. React in one short line.'})});
    const j2=await r2.json(); lastReply=(j2.reply||'').replaceAll('///',' ');
    await loadHistory(); loadNudges();
  }catch(e){}
}
async function exportMem(){
  const r=await api('/api/export'); const b=await r.blob();
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='personal-guide-memory.json'; a.click();
  document.getElementById('setmsg').textContent='✓ Memory downloaded. Import it on the new device.';
}
async function importMem(){
  const f=document.getElementById('impfile').files[0]; if(!f)return;
  const fd=new FormData(); fd.append('file',f);
  const r=await api('/api/import',{method:'POST',body:fd,headers:pw()?{'x-app-password':pw()}:{}});
  const j=await r.json();
  document.getElementById('setmsg').textContent=j.error?('Note: '+j.error):('✓ Imported '+j.messages+' messages, '+j.facts+' facts.');
  document.getElementById('impfile').value='';
  loadHistory();
}
async function delMsg(id){ if(!confirm('Delete this message?'))return; await api('/api/message/'+id,{method:'DELETE'}); loadHistory(); }
async function clearChat(){ if(!confirm('Delete ALL chat history? Memory facts stay.'))return; await api('/api/clear',{method:'POST'}); loadHistory(); }
async function saveProfile(){
  const name=prompt('Your name?'); const goals=prompt('Your #1 goal?');
  await api('/api/profile',{method:'POST',body:JSON.stringify({name,goals:goals?[goals]:[]})});
  bubble('p'+Date.now(),'bot','✓ Profile saved.'); loadHistory();
}
function toggleVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Voice input needs Chrome.');return;}
  if(listening){recog.stop();listening=false;return;}
  recog=new SR(); recog.lang='en-US'; listening=true;
  recog.onresult=e=>{document.getElementById('in').value=e.results[0][0].transcript; send();};
  recog.onend=()=>listening=false; recog.start();
}
function speakLast(){ if(!lastReply)return; speechSynthesis.speak(new SpeechSynthesisUtterance(lastReply.slice(0,300))); }
async function snap(){
  const v=document.getElementById('cam'); v.style.display='block';
  const s=await navigator.mediaDevices.getUserMedia({video:true}); v.srcObject=s;
  setTimeout(()=>{
    const c=document.getElementById('cv'); c.width=v.videoWidth; c.height=v.videoHeight;
    c.getContext('2d').drawImage(v,0,0);
    const shot=c.toDataURL('image/jpeg',0.8);
    staged={kind:'image',dataUrl:shot,file:null}; img=shot;
    s.getTracks().forEach(t=>t.stop()); v.style.display='none';
    stageChip('Photo captured — write a message and Send.');
  },2500);
}
